@if (userName$ | async; as userName) {
  <mat-toolbar class="app-toolbar">
    <img
      class="brand-logo"
      src="https://www.genasystech.com/wp-content/uploads/2026/02/Genasys-White-V2.png"
      alt="Genasys Technologies">
    <span class="spacer"></span>
    <span class="welcome"><mat-icon inline>account_circle</mat-icon>{{ userName }}</span>
    <button class="logout-btn" mat-button (click)="logout()"><mat-icon>logout</mat-icon> Log out</button>
  </mat-toolbar>

  <mat-sidenav-container class="app-shell">
    <mat-sidenav mode="side" opened class="app-sidenav">
      <mat-nav-list>
        <a mat-list-item class="nav-customers" routerLink="/customers" routerLinkActive="active-link">
          <mat-icon matListItemIcon>group</mat-icon>
          <span matListItemTitle>Customers</span>
        </a>
        <a mat-list-item class="nav-quotes" routerLink="/quotes" routerLinkActive="active-link">
          <mat-icon matListItemIcon>request_quote</mat-icon>
          <span matListItemTitle>Quotes</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <main class="app-content">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <footer class="app-footer">
    <span>&copy; 2026 Genasys Technologies</span>
    <span>Frontend Developer Assessment</span>
  </footer>
} @else {
  <main class="app-content full-bleed">
    <router-outlet />
  </main>
}
